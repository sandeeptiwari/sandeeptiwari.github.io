<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">RDS Multi-AZ vs Read Replica</title><desc id="desc">Multi-AZ provides standby failover for availability, while Read Replicas primarily scale read workloads.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#173B68"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter></defs><rect width="100%" height="100%" fill="white"/><text x="300" y="55" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#2B6CB0">Multi-AZ — Availability</text><text x="900" y="55" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#2B6CB0">Read Replica — Read Scaling</text><rect x="40" y="80" width="520" height="430" rx="25" fill="none" stroke="#B7CBE5" stroke-width="2"/><rect x="640" y="80" width="520" height="430" rx="25" fill="none" stroke="#B7CBE5" stroke-width="2"/><g filter="url(#shadow)"><rect x="90" y="180" width="170" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="175.0" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Application</text><text x="175.0" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Writes</text></g><g filter="url(#shadow)"><rect x="350" y="140" width="180" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="440.0" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Primary RDS</text><text x="440.0" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">AZ-A</text></g><g filter="url(#shadow)"><rect x="350" y="350" width="180" height="90" rx="18" fill="#F5EEFF" stroke="#7652A8" stroke-width="3"/><text x="440.0" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Standby RDS</text><text x="440.0" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">AZ-B / failover</text></g><line x1="260" y1="225" x2="350" y2="185" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><line x1="440" y1="230" x2="440" y2="350" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><text x="440.0" y="280.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">synchronous</text><g filter="url(#shadow)"><rect x="690" y="180" width="180" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="780.0" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Application</text><text x="780.0" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Reads + Writes</text></g><g filter="url(#shadow)"><rect x="950" y="140" width="170" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="1035.0" y="178" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Primary RDS</text><text x="1035.0" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Writes</text></g><g filter="url(#shadow)"><rect x="950" y="350" width="170" height="90" rx="18" fill="#EAF8F2" stroke="#2E8B67" stroke-width="3"/><text x="1035.0" y="388" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Read Replica</text><text x="1035.0" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Reads</text></g><line x1="870" y1="225" x2="950" y2="185" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><line x1="1035" y1="230" x2="1035" y2="350" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><text x="1035.0" y="280.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">replication</text></svg>