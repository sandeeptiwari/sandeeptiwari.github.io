<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">AWS Disaster Recovery Strategies</title><desc id="desc">Comparison of Backup and Restore, Pilot Light, Warm Standby and Multi-Site Active Active disaster recovery strategies.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#173B68"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#173B68">Disaster Recovery Strategy Spectrum</text><text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="17" fill="#526579">Lower RTO/RPO generally requires more cost and operational complexity</text><g filter="url(#shadow)"><rect x="70" y="220" width="220" height="190" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="180.0" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Backup &amp; Restore</text><text x="180.0" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Lowest cost</text></g><text x="180" y="445" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Longest recovery</text><g filter="url(#shadow)"><rect x="360" y="220" width="220" height="190" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="470.0" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Pilot Light</text><text x="470.0" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Critical core</text></g><text x="470" y="445" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Scale during DR</text><g filter="url(#shadow)"><rect x="650" y="220" width="220" height="190" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="760.0" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Warm Standby</text><text x="760.0" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Reduced capacity</text></g><text x="760" y="445" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Scale quickly</text><g filter="url(#shadow)"><rect x="940" y="220" width="220" height="190" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="1050.0" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Active/Active</text><text x="1050.0" y="290" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Full capacity</text></g><text x="1050" y="445" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Fastest recovery</text><line x1="290" y1="315" x2="360" y2="315" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><line x1="580" y1="315" x2="650" y2="315" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><line x1="870" y1="315" x2="940" y2="315" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><text x="600" y="530" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#D17A00">Cost / complexity increases →</text></svg>