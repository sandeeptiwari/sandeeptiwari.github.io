<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Highly Available AWS Web Application</title><desc id="desc">Route 53 sends users to an Application Load Balancer, which distributes traffic across EC2 instances in multiple Availability Zones.</desc>
