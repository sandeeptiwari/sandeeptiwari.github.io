<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">CloudFront S3 OAC Architecture</title><desc id="desc">Users access CloudFront while Origin Access Control allows CloudFront to retrieve objects from a private S3 bucket.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#173B68"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-opacity=".12"/></filter></defs><rect width="100%" height="100%" fill="white"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#173B68">CloudFront + Private S3 + OAC</text><g filter="url(#shadow)"><rect x="70" y="300" width="170" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="155.0" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Users</text><text x="155.0" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Global</text></g><g filter="url(#shadow)"><rect x="330" y="300" width="210" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="435.0" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">CloudFront</text><text x="435.0" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Edge locations</text></g><g filter="url(#shadow)"><rect x="650" y="300" width="220" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="760.0" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">Origin Access</text><text x="760.0" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Control</text></g><g filter="url(#shadow)"><rect x="980" y="300" width="170" height="90" rx="18" fill="#EAF3FF" stroke="#2B6CB0" stroke-width="3"/><text x="1065.0" y="338" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#173B68">S3 Bucket</text><text x="1065.0" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526579">Private</text></g><line x1="240" y1="345" x2="330" y2="345" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><line x1="540" y1="345" x2="650" y2="345" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><line x1="870" y1="345" x2="980" y2="345" stroke="#173B68" stroke-width="4" marker-end="url(#arrow)"/><text x="1065" y="445" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Bucket stays private</text></svg>