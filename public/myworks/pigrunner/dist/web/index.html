<!doctype html>
<html lang="en">
<head>
  <title>Pig Runner</title>
  <meta charset="UTF-8">
  <meta id="gameViewport" name="viewport" content="width=device-width, initial-scale=1">
  <!-- All URLs are relative so the build works from any sub-path, e.g. /games/pig-runner/. -->
  <link href="styles.css" rel="stylesheet" type="text/css">
  <link rel="icon" href="data:,"> <!-- no favicon request (avoids a 404 at the site root) -->
</head>

<body>

<div id="embed-html"></div>
<script type="text/javascript" src="html/html.nocache.js"></script>
</body>

<script>
// Keep keyboard focus on the game (important inside an iframe) and stop the page from
// scrolling/selecting or opening the context menu while playing.
function handleMouseDown(evt) {
  evt.preventDefault();
  evt.stopPropagation();
  window.focus();
}

function handleMouseUp(evt) {
  evt.preventDefault();
  evt.stopPropagation();
}
document.addEventListener('contextmenu', event => event.preventDefault());
document.getElementById('embed-html').addEventListener('mousedown', handleMouseDown, false);
document.getElementById('embed-html').addEventListener('mouseup', handleMouseUp, false);
// Arrow keys / space would otherwise scroll a parent page when embedded.
window.addEventListener('keydown', function (e) {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].indexOf(e.key) >= 0) e.preventDefault();
}, false);
</script>
</html>
