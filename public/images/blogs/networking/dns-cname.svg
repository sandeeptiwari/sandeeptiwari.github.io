<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d7ff2"/>
      <stop offset="100%" stop-color="#1554b8"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20b486"/>
      <stop offset="100%" stop-color="#087a60"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 58px Arial,sans-serif;fill:#102a56}
      .subtitle{font:400 25px Arial,sans-serif;fill:#58708c}
      .label{font:700 23px Arial,sans-serif}
      .body{font:400 20px Arial,sans-serif;fill:#254568}
      .small{font:400 17px Arial,sans-serif;fill:#47627e}
      .mono{font:700 27px 'Courier New',monospace}
      .card{stroke:#d7e7f7;stroke-width:2}
    </style>
  </defs>

  <rect width="1536" height="1024" fill="url(#bg)"/>

  <!-- Header -->
  <text x="70" y="92" class="title">DNS CNAME — Canonical Name</text>
  <text x="70" y="132" class="subtitle">One hostname points to another hostname instead of directly pointing to an IP address.</text>

  <!-- Main example -->
  <rect x="55" y="175" width="1426" height="245" rx="28" fill="#ffffff" class="card" filter="url(#shadow)"/>
  <text x="88" y="220" class="label" fill="#163d72">Example</text>

  <rect x="100" y="255" width="385" height="105" rx="20" fill="#e9f4ff" stroke="#69aaf5" stroke-width="3"/>
  <text x="125" y="297" class="small">User requests</text>
  <text x="125" y="337" class="mono" fill="#1554b8">www.example.com</text>

  <line x1="505" y1="307" x2="720" y2="307" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="540" y="283" class="small" fill="#2563eb">CNAME record</text>

  <rect x="745" y="255" width="430" height="105" rx="20" fill="#e9fbf4" stroke="#3ac69b" stroke-width="3"/>
  <text x="770" y="297" class="small">DNS returns canonical hostname</text>
  <text x="770" y="337" class="mono" fill="#087a60">app.example.net</text>

  <line x1="1195" y1="307" x2="1375" y2="307" stroke="#16a57d" stroke-width="5" marker-end="url(#arrow)"/>
  <rect x="1240" y="255" width="180" height="105" rx="20" fill="#eefbf7" stroke="#b4ead9" stroke-width="2"/>
  <text x="1263" y="296" class="small">Then resolve</text>
  <text x="1263" y="331" class="mono" font-size="23" fill="#087a60">A / AAAA</text>

  <!-- Record card -->
  <rect x="55" y="450" width="690" height="355" rx="26" fill="#ffffff" class="card" filter="url(#shadow)"/>
  <text x="88" y="498" class="label" fill="#102a56">DNS record</text>

  <rect x="88" y="525" width="624" height="65" rx="14" fill="#f3f7fc"/>
  <text x="112" y="566" class="mono" font-size="23" fill="#102a56">www.example.com</text>
  <rect x="495" y="538" width="90" height="38" rx="19" fill="#20b486"/>
  <text x="517" y="564" font="700 19px Arial" fill="#fff">CNAME</text>

  <line x1="88" y1="610" x2="712" y2="610" stroke="#dbe7f3"/>
  <text x="112" y="648" class="small">Target</text>
  <text x="112" y="684" class="mono" font-size="24" fill="#087a60">app.example.net</text>

  <text x="112" y="730" class="small">Meaning</text>
  <text x="112" y="762" class="body">“For this name, use this other hostname.”</text>

  <!-- What happens -->
  <rect x="780" y="450" width="701" height="355" rx="26" fill="#ffffff" class="card" filter="url(#shadow)"/>
  <text x="815" y="498" class="label" fill="#102a56">What happens during lookup?</text>

  <circle cx="835" cy="548" r="22" fill="#2563eb"/><text x="828" y="556" font="700 18px Arial" fill="#fff">1</text>
  <text x="875" y="556" class="body">Resolver asks for www.example.com.</text>

  <circle cx="835" cy="612" r="22" fill="#20b486"/><text x="828" y="620" font="700 18px Arial" fill="#fff">2</text>
  <text x="875" y="620" class="body">Authoritative DNS returns the CNAME target.</text>

  <circle cx="835" cy="676" r="22" fill="#8b5cf6"/><text x="828" y="684" font="700 18px Arial" fill="#fff">3</text>
  <text x="875" y="684" class="body">Resolver follows app.example.net.</text>

  <circle cx="835" cy="740" r="22" fill="#f59e0b"/><text x="828" y="748" font="700 18px Arial" fill="#fff">4</text>
  <text x="875" y="748" class="body">A/AAAA lookup finally provides the IP.</text>

  <!-- Bottom comparison -->
  <rect x="55" y="840" width="1426" height="130" rx="26" fill="#102a56"/>
  <text x="88" y="884" class="label" fill="#ffffff">CNAME vs A record</text>

  <rect x="410" y="858" width="315" height="82" rx="16" fill="#183c70"/>
  <text x="435" y="888" font="700 19px Arial" fill="#8fc5ff">A</text>
  <text x="435" y="918" class="small" fill="#d8eaff">hostname → IPv4 address</text>

  <rect x="755" y="858" width="315" height="82" rx="16" fill="#183c70"/>
  <text x="780" y="888" font="700 19px Arial" fill="#72e4bd">CNAME</text>
  <text x="780" y="918" class="small" fill="#d8eaff">hostname → hostname</text>

  <rect x="1100" y="858" width="340" height="82" rx="16" fill="#183c70"/>
  <text x="1125" y="888" font="700 19px Arial" fill="#d8c2ff">Important</text>
  <text x="1125" y="918" class="small" fill="#d8eaff">CNAME does not contain the IP.</text>
</svg>